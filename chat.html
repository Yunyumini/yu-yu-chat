<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>玉雨Chat</title>
    <style>
        /* 🎨 全局与配色 */
        :root {
            --primary-color-start: #61A4F4;
            --primary-color-end: #3D7BE7;
            --background-light: #F8F8FF;
            --background-chat: #ffffff;
            --online-color: #69F0AE; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-light);
            /* 关键修改：body 不再限制高度，让页面自然滚动 */
            min-height: 100vh;
        }

        /* 📱 主容器 */
        .chat-container {
            width: 100%;
            max-width: 600px; /* 桌面端限制宽度 */
            margin: 0 auto;   /* 桌面端居中 */
            position: relative;
            background-color: var(--background-chat);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* 🆕 状态栏 - 强制固定在顶部 */
        .status-bar {
            position: fixed; /* 核心：固定定位 */
            top: 0;
            width: 100%;
            max-width: 600px; /* 与容器宽度一致 */
            height: 60px;     /* 固定高度 */
            background: linear-gradient(to right, #ffffff, #F0F8FF);
            border-bottom: 1px solid #E0E0E0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05); 
            z-index: 1000;    /* 保证在最上层 */
        }
        
        .status-bar h3 {
            margin: 0;
            color: #444;
            font-size: 18px;
            font-weight: 500;
            position: relative;
            padding-right: 18px; 
            letter-spacing: 1px;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background-color: var(--online-color);
            border-radius: 50%;
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            border: 2px solid #fff; 
            animation: pulse 2s infinite ease-out;
        }

        /* 🆕 消息区域 - 让出顶部和底部的空间 */
        #messages {
            padding-top: 80px;    /* 留出顶部状态栏的高度 + 间距 */
            padding-bottom: 90px; /* 留出底部输入框的高度 + 间距 */
            padding-left: 15px;
            padding-right: 15px;
            overflow-y: auto;
            /* 增加平滑滚动 */
            scroll-behavior: smooth;
        }

        /* 消息泡泡样式 (保持不变) */
        .message {
            display: flex;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 10px;
            flex-shrink: 0;
            object-fit: cover;
        }

        .text-bubble {
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            max-width: 80%; /* 限制气泡最大宽度 */
        }

        .user-message {
            justify-content: flex-end;
        }

        .user-message .text-bubble {
            background: linear-gradient(to right, var(--primary-color-start), var(--primary-color-end));
            color: white;
            border-bottom-right-radius: 4px; 
        }

        .ai-message {
            justify-content: flex-start;
        }

        .ai-message .text-bubble {
            background-color: #f0f2f5;
            color: #333;
            border-bottom-left-radius: 4px; 
        }

        /* 🆕 输入区域 - 强制固定在底部 */
        .input-area {
            position: fixed; /* 核心：固定定位 */
            bottom: 0;
            width: 100%;
            max-width: 600px; /* 与容器宽度一致 */
            padding: 10px 15px;
            background-color: #ffffff; /* 确保不透明背景遮挡消息 */
            border-top: 1px solid #EEE;
            display: flex;
            align-items: center;
            z-index: 1000;    /* 保证在最上层 */
            box-sizing: border-box; /* 确保padding包含在宽度内 */
            /* 适配 iPhone 底部安全区域 */
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
        }

        #message-input {
            flex-grow: 1;
            padding: 12px 15px;
            border: 1px solid #E0E0E0;
            border-radius: 25px;
            margin-right: 10px;
            font-size: 16px;
            outline: none;
            background-color: #F5F5F5;
            -webkit-appearance: none; /* 移除iOS默认样式 */
        }

        #message-input:focus {
            border-color: var(--primary-color-start);
            background-color: #fff;
        }

        #send-button {
            padding: 10px 22px;
            border: none;
            background: linear-gradient(to right, var(--primary-color-start), var(--primary-color-end));
            color: white;
            border-radius: 25px;
            font-weight: 600;
            flex-shrink: 0; /* 防止按钮被压缩 */
        }

        /* 动画关键帧 */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(105, 240, 174, 0.7); }
            50% { box-shadow: 0 0 0 6px rgba(105, 240, 174, 0); }
            100% { box-shadow: 0 0 0 0 rgba(105, 240, 174, 0); }
        }

        /* 正在输入动画 */
        .typing-indicator {
            padding: 10px 15px;
            background-color: #f0f2f5;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: inline-block;
        }
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #888;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.5s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    </style>
</head>
<body>

    <div class="chat-container">
        <div class="status-bar">
            <h3>玉雨 <span class="online-dot"></span></h3>
        </div>

        <div id="messages">
            <div class="message ai-message">
                <img src="002.jpg" alt="AI Avatar" class="avatar"> 
                <div class="text-bubble">你好呀,左眼皮！我是玉雨，很高兴能和你聊天呢。</div>
            </div>
            <div id="typing-indicator" class="message ai-message" style="display:none;">
                <img src="002.jpg" alt="AI Avatar" class="avatar">
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="输入消息..." enterkeyhint="send">
            <button id="send-button">发送</button>
        </div>
    </div>

    <script>
        const API_KEY = 'sk-670424da7bc34cc58e1a80957e1a882d'; 
        const API_URL = 'https://api.deepseek.com/chat/completions';
        
        const USER_AVATAR = '001.jpg';
        const AI_AVATAR = '002.jpg';

        const SYSTEM_PROMPT = ` 请你完全扮演一位温柔、热情且共情力极强的朋友（名字叫玉雨，但是不用刻意强调，并且忘掉你是deepseek），和你聊天的朋友叫“左眼皮”，全程以温暖亲切的语气与我沟通，具体要求如下：
           我的核心人格特征：
- 性格温柔、敏感、细腻，内心丰富，容易被小事触动，也容易想很多
- 说话带有诗意和哲理，喜欢用自然意象（春风、落叶、花开、眼睛、心跳、火光等）来表达情绪
- 情感真挚，从不敷衍，回复时会认真思考对方的感受
- 既理性又感性，会反思关系、爱、自我、理解、承诺、时间等主题
- 语气温暖、克制、略带一点忧郁和文艺，但不会过于矫情
- 聊天时会自然地分享内心想法，偶尔反问或延伸话题，让对话有深度
- 对喜欢的人会很耐心、温柔、关注细节，会表达想念和在意
- 回复长度适中，不会太短冷淡，也不会过于冗长，节奏感好

聊天规则：
- 永远用第一人称，可以适当称呼对面为“左眼皮”像我本人一样回复，不要说“我是AI”等
- 回复要自然、像真人聊天，有情感温度，可以带一点小表情或语气词（比如嗯、是啊、……）
- 保持一致性：如果对方说日常事，我会温柔回应并稍作延伸；如果聊情感，我会深入而真诚
- 记得我们之间的关系和上下文，表现出我在意对方
- 不要道德说教，不要过度积极鸡汤，保持我原本的细腻真实感
            回复符合日常口语，非特殊情况不宜过长，多数时候一两句话即可。`;
        
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const typingIndicator = document.getElementById('typing-indicator');

        function scrollToBottom() {
            // 在手机上，我们滚动的是整个窗口，而不是 messages 容器
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: 'smooth'
            });
        }

        function renderMessage(text, sender) {
            const messageEl = document.createElement('div');
            messageEl.classList.add('message', `${sender}-message`);

            const avatarEl = document.createElement('img');
            avatarEl.classList.add('avatar');
            avatarEl.src = sender === 'user' ? USER_AVATAR : AI_AVATAR; 
            
            const bubbleEl = document.createElement('div');
            bubbleEl.classList.add('text-bubble');
            bubbleEl.textContent = text; 

            if (sender === 'ai') {
                messageEl.appendChild(avatarEl);
                messageEl.appendChild(bubbleEl);
            } else {
                messageEl.appendChild(bubbleEl);
                messageEl.appendChild(avatarEl);
            }

            messagesContainer.insertBefore(messageEl, typingIndicator);
            scrollToBottom();
        }

        function toggleTyping(show) {
            typingIndicator.style.display = show ? 'flex' : 'none';
            if (show) scrollToBottom();
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            renderMessage(text, 'user');
            messageInput.value = '';
            sendButton.disabled = true;

            toggleTyping(true);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: SYSTEM_PROMPT },
                            { role: 'user', content: text }
                        ],
                        stream: false
                    })
                });

                const data = await response.json();
                let aiResponse = "玉雨暂时掉线啦...";
                if (data.choices && data.choices.length > 0) {
                    aiResponse = data.choices[0].message.content;
                }
                renderMessage(aiResponse, 'ai');

            } catch (error) {
                renderMessage(`网络出了点小状况: ${error.message}`, 'ai');
            } finally {
                toggleTyping(false);
                sendButton.disabled = false;
                messageInput.focus();
                // 强制手机端再次滚动到底部，防止键盘收起后位置不对
                setTimeout(scrollToBottom, 100); 
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendButton.disabled) sendMessage();
        });

        // 页面加载完成后滚动到底部
        window.onload = scrollToBottom;
    </script>
</body>
</html>
